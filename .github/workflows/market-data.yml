name: Refresh free market data
on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"
permissions:
  contents: write
concurrency:
  group: market-data-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Retain last available quotes
        run: |
          mkdir -p /tmp/atlas-market-data
          git fetch origin market-data
          git archive origin/market-data | tar -x -C /tmp/atlas-market-data
      - name: Fetch public market data
        run: node scripts/export-market-data.mjs /tmp/atlas-market-data
      - name: Recheck declared unlock schedule
        run: node scripts/export-announced-unlocks.mjs /tmp/atlas-market-data
      - name: Publish data branch
        run: |
          git switch --force-create market-data origin/market-data
          cp -R /tmp/atlas-market-data/. .
          git add snapshots history status.json announced-unlocks.json
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Refresh public market snapshots'
          git push origin HEAD:market-data
